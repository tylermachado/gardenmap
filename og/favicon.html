<!doctype html>
<!--
	Source for the favicon / app icon set.

	An MNPL monogram, one letter per quadrant, set in Faculty Glyphic — the
	same face as --font-serif in src/app.css, which the app uses for headings.

	Rendered by og/render-icons.sh (`npm run icons`), which drives this page at
	1024x1024 and downsamples. Everything is sized in vmin so the layout is
	resolution-independent.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- display=block, not swap: a fallback face must never win the screenshot race. -->
		<link
			href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&display=block"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 100vw;
				height: 100vh;
				overflow: hidden;
			}

			.tile {
				width: 100vw;
				height: 100vh;
				/* lime-950, matching the app header. Fully opaque: iOS rejects
				   transparency in apple-touch-icon and composites it onto black. */
				background: #1a2e05;

				display: grid;
				grid-template-columns: 1fr 1fr;
				grid-template-rows: 1fr 1fr;

				/*
					Tight padding on purpose. At 32px each letter only gets ~14px of
					its own, so the monogram has to run close to the edge to stay
					legible — but not so close that iOS clips it when rounding the
					corners of the apple-touch-icon.
				*/
				padding: 5vmin;
			}

			.letter {
				display: flex;
				align-items: center;

				font-family: 'Faculty Glyphic', ui-serif, Georgia, serif;
				font-size: 44vmin;
				color: #f5f5f4;

				/*
					Sub-1 line-height shrinks each line box so the two rows close up
					on each other. The glyphs overflow their boxes, which is fine —
					cap height is well under 1em.
				*/
				line-height: 0.8;

				/*
					No letter-spacing here. Each letter is its own flex item, so it
					has no letters to space against — all it does is add trailing
					advance after the glyph, which shoves the right-aligned column
					off-centre.
				*/
			}

			/*
				Align to the block rather than centring each letter in its own cell.
				Centring makes the narrow P and L sit visibly indented from the wider
				M and N; flushing the left column left and the right column right
				squares the four letters into one mass.
			*/
			.letter:nth-child(odd) {
				justify-content: flex-start;
			}

			.letter:nth-child(even) {
				justify-content: flex-end;
			}
		</style>
	</head>
	<body>
		<div class="tile">
			<span class="letter">M</span>
			<span class="letter">N</span>
			<span class="letter">P</span>
			<span class="letter">L</span>
		</div>
	</body>
</html>
