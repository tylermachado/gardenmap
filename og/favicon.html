<!doctype html>
<!--
	Source for the favicon / app icon set.

	Rendered at several square sizes by og/render-icons.sh (`npm run icons`),
	which drives this page at different viewport sizes — everything below is
	sized in vmin so one template covers 32px through 512px.

	The plant path is inlined (rather than <img src="plant.svg">) because
	static/logos/plant.svg carries opacity="0.5" on its root element for its
	use as a placeholder thumbnail in the app. That file is shared by four
	components, so it is left alone and the mark is restated here at full
	strength.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 100vw;
				height: 100vh;
				overflow: hidden;
			}

			.tile {
				width: 100vw;
				height: 100vh;
				/* lime-950, matching the app header. Fully opaque: iOS rejects
				   transparency in apple-touch-icon and composites it onto black. */
				background: #1a2e05;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			/*
				The mark is a wide 163.7x122.9 shape, so it is width-constrained.
				76vmin leaves enough margin that the leaves don't touch the edge
				once iOS rounds the corners off.
			*/
			.mark {
				width: 76vmin;
				height: auto;
				display: block;
				fill: #f5f5f4;
			}
		</style>
	</head>
	<body>
		<div class="tile">
			<svg class="mark" viewBox="0 0 163.7 122.9" xmlns="http://www.w3.org/2000/svg">
				<path
					fill-rule="evenodd"
					d="M52.9,104.2c.5-11,11.9-16.6,22.9-11.8,2-2.2,4.4-3.7,6.9-4.7-7.7-18.3-15-26.6-20.4-29C14.5,78.7,22,42.7,0,27.7c42.6-14.3,63.1-15.1,66.5,25.7,7,7,13.7,13.5,20.6,28.4,8.7-31.6,34.4-56.7,67.4-73.7-32.3,14.1-46.1,23.7-59.6,45.2C78.5-4.3,132.2,14.1,163.7,0c-15.6,30-13.1,77.7-58.5,59.9-4.8,5.3-10.2,15.9-12.3,27.3,5.1,1.4,9.3,5.3,10.4,11.3,8-5.8,18.3,0,17.4,9.7,5.5-2,13.2,5.1,2.7,5.8-23.6,1.4-26,8.9-39.6,8.9s-5.9-5.2-30.9-8.1c-17.4-2-3.5-11.1.1-10.6Z"
				/>
			</svg>
		</div>
	</body>
</html>
